.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.th{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#a4161a,#1f7a4d);display:flex;align-items:center;justify-content:center;font-size:2.4rem;margin-bottom:6px}.th img{position:absolute;inset:0;z-index:1}.grid img{width:100%;border-radius:10px;aspect-ratio:16/9;object-fit:cover}

<script>const C={"app": {"name": "Receitas de Natal", "shortName": "Receitas Natal", "tagline": "A Ceia Perfeita, Sem Estresse", "description": "Monte a ceia de Natal mais bonita da sua vida em 4 semanas: entradas, peru, tender, bacalhau, acompanhamentos, sobremesas e panetone caseiro — com lista de compras, cronograma e receitas passo a passo.", "lang": "pt-BR", "shareText": "Olha esse app de Receitas de Natal — a ceia inteira planejada em 4 semanas!", "storagePrefix": "receitas_natal", "logoUrl": "https://pub-494a57bf4d6f4cbcbeb4ad55a033908f.r2.dev/images/receitas_natal/capa_v2.jpg", "faviconUrl": "https://pub-494a57bf4d6f4cbcbeb4ad55a033908f.r2.dev/images/receitas_natal/capa_v2.jpg"}, "theme": {"dark": {"primary": "#d62839", "primaryDark": "#a4161a", "secondary": "#1f7a4d", "accent": "#1f7a4d", "dark": "#1b1013", "darker": "#110a0c", "light": "#fbf3e9", "gradient": "linear-gradient(135deg, #d62839, #1f7a4d)", "gradientSoft": "linear-gradient(135deg, #a4161a 0%, #f2c14e 100%)", "gradientDark": "linear-gradient(135deg, #1b1013 0%, #110a0c 100%)"}, "light": {"primary": "#c1121f", "primaryDark": "#a4161a", "secondary": "#1f7a4d", "accent": "#c1121f", "dark": "#fbf3e9", "darker": "#f1e3d3", "light": "#1b1013", "gradient": "linear-gradient(135deg, #c1121f 0%, #1f7a4d 100%)", "gradientDark": "linear-gradient(135deg, #f1e3d3 0%, #fbf3e9 100%)"}, "themeColor": "#d62839"}, "hero": {"badge": "CEIA DE NATAL", "title": "A Ceia de <span>Natal<\/span> dos Seus Sonhos", "buttonPrimary": {"text": "Ver Receitas", "page": "treinos"}, "buttonSecondary": {"text": "Ouvir Podcasts", "page": "podcast"}, "phrases": ["Natal é a <em>mesa cheia<\/em> e a família reunida em volta dela.", "Planejar com antecedência é o <em>segredo da ceia sem estresse<\/em>.", "O peru suculento começa <em>dois dias antes<\/em>, na salmoura.", "Uma sobremesa caseira vale mais que <em>qualquer presente comprado<\/em>.", "Ceia bonita não precisa ser cara: precisa ser <em>bem pensada<\/em>.", "O cheiro de canela e cravo é o <em>perfume oficial do Natal<\/em>.", "Cozinhar para quem você ama é o <em>presente mais bonito<\/em> do ano."]}, "articles": [{"id": "ceia-sem-estresse", "icon": "🗓️", "title": "A Ceia Sem Estresse Começa 4 Semanas Antes", "cardDesc": "Por que quem planeja come junto com a família — e quem improvisa passa a noite na cozinha.", "subtitle": "O cronograma que os bufês usam, adaptado para a sua casa.", "content": "<h3>😩 O problema de verdade<\/h3>\n<p>Todo ano a cena se repete em milhões de casas: é dia 24, são seis da tarde, o peru ainda está duro no meio, o forno não comporta tudo ao mesmo tempo, falta papel-alumínio, alguém precisa correr ao mercado lotado e a pessoa que cozinha passa a noite inteira suando entre a pia e o fogão. Quando a ceia finalmente vai para a mesa, ela está cansada demais para aproveitar. O Natal, que deveria ser o momento de estar com quem você ama, vira uma maratona.<\/p>\n<p>A causa quase nunca é falta de habilidade. É falta de <strong>cronograma<\/strong>. A ceia de Natal tem uma característica que nenhuma outra refeição do ano tem: muitos pratos, todos para o mesmo horário, para muita gente. Tentar resolver isso em um dia só é como tentar fazer uma mudança de casa numa tarde.<\/p>\n\n<h3>🧠 Como os profissionais resolvem<\/h3>\n<p>Bufês que servem 200 pessoas numa noite não cozinham tudo naquela noite. Eles trabalham com uma regra simples: <strong>separar o que pode ser feito antes do que só pode ser feito na hora<\/strong>. A maior parte de uma ceia pode ser adiantada sem perder nada de sabor — e algumas coisas até ficam melhores.<\/p>\n<ul>\n<li><strong>Pode ser feito semanas antes:<\/strong> massas de biscoito, panetone, bolinhos crus, farofa, molhos, pão de alho, carnes temperadas congeladas.<\/li>\n<li><strong>Pode ser feito na véspera:<\/strong> pavê, manjar, pudim, torta holandesa, salpicão, maionese, a marinada das carnes.<\/li>\n<li><strong>Só no dia:<\/strong> assar a carne principal, o arroz, montar as saladas folhosas e esquentar o que estava pronto.<\/li>\n<\/ul>\n<p>Quando você coloca cada prato numa dessas três caixas, o dia 24 encolhe. Em vez de 12 pratos para fazer do zero, sobram dois ou três.<\/p>\n\n<h3>📅 As 4 semanas, uma a uma<\/h3>\n<ol>\n<li><strong>Semana 1 — Planejar e testar entradas.<\/strong> Defina o cardápio, calcule as quantidades, faça a lista de compras e compre tudo o que não estraga. Teste as entradas e bebidas: se a pasta ou o ponche não agradarem, ainda dá tempo de trocar.<\/li>\n<li><strong>Semana 2 — As carnes.<\/strong> Compre as carnes congeladas e aprenda o ponto de cada uma. Teste o termômetro. Se você nunca fez peru, faça um frango com a mesma técnica de salmoura: é o ensaio perfeito.<\/li>\n<li><strong>Semana 3 — Acompanhamentos e freezer.<\/strong> Faça e congele farofas, molhos e pães. Monte o cronograma da véspera e teste a mesa posta.<\/li>\n<li><strong>Semana 4 — Sobremesas e a grande noite.<\/strong> Asse panetones e biscoitos, faça as sobremesas geladas na véspera e siga o cronograma hora a hora no dia 24.<\/li>\n<\/ol>\n\n<h3>💰 O efeito no bolso<\/h3>\n<p>Planejar não é só tranquilidade: é dinheiro. Nos últimos cinco dias antes do Natal, os preços de frutas secas, castanhas, bacalhau e carnes especiais sobem bastante, e as filas fazem você comprar o que tiver, não o que precisa. Quem compra os itens secos na semana 1 e as carnes na semana 2 costuma economizar uma boa parte da conta — e não corre o risco de chegar ao mercado e não encontrar o peru do tamanho certo.<\/p>\n<p>Calcular as quantidades também evita o desperdício clássico: a geladeira lotada de sobra no dia 26. Com as medidas por pessoa deste app, você compra o suficiente para todo mundo repetir, sem jogar comida fora.<\/p>\n\n<h3>✅ Comece hoje<\/h3>\n<p>Abra a Semana 1 e faça a primeira tarefa: <strong>defina o cardápio<\/strong>. Não precisa ser perfeito — precisa existir. A partir dele tudo se encaixa: a lista de compras, o cronograma e o que você vai testar a cada semana. Daqui a quatro semanas, enquanto a família chega, você vai estar arrumado(a), com tudo pronto, e com tempo de sentar à mesa. Esse é o melhor presente que a ceia pode dar para quem cozinha.<\/p>"}, {"id": "peru-suculento", "icon": "🦃", "title": "Peru Suculento: A Ciência por Trás da Carne Perfeita", "cardDesc": "Por que o peito do peru resseca — e as três técnicas que resolvem de vez.", "subtitle": "Salmoura, termômetro e descanso: o trio que nunca falha.", "content": "<h3>😩 O problema de verdade<\/h3>\n<p>O peru é o centro da mesa de Natal, e também a maior fonte de frustração. Quem nunca cortou um peito de peru dourado e lindo por fora, e encontrou por dentro uma carne seca, fibrosa, que precisa de muito molho para descer? Ou, pior, o oposto: a coxa ainda rosada perto do osso quando todo mundo já está sentado.<\/p>\n<p>Isso acontece por um motivo físico simples: o peru tem duas carnes diferentes no mesmo animal. O <strong>peito é magro<\/strong> e fica pronto mais cedo; a <strong>coxa tem mais gordura e tecido conjuntivo<\/strong> e precisa de mais tempo. Quando você espera a coxa ficar pronta, o peito já passou do ponto.<\/p>\n\n<h3>🧂 Técnica 1: a salmoura<\/h3>\n<p>A salmoura é água com sal e açúcar onde a ave fica mergulhada de 12 a 24 horas. O sal muda a estrutura das proteínas da carne, que passam a <strong>reter mais água<\/strong> durante o cozimento. Na prática, o peru que passou pela salmoura perde muito menos suco no forno e chega à mesa visivelmente mais suculento.<\/p>\n<ul>\n<li>Use 1 xícara de sal grosso e 1/2 xícara de açúcar para cada 6 litros de água.<\/li>\n<li>Adicione aromáticos: louro, alecrim, alho, casca de laranja.<\/li>\n<li>A salmoura tem que estar <strong>gelada<\/strong> antes de receber a ave.<\/li>\n<li>Depois, lave e seque bem: pele seca é pele crocante.<\/li>\n<\/ul>\n<p><strong>Atenção:<\/strong> o peru temperado industrializado já vem injetado com salmoura. Se você colocar ele em salmoura de novo, vai ficar salgado demais. A técnica é para peru natural, sem tempero.<\/p>\n\n<h3>🌡️ Técnica 2: o termômetro<\/h3>\n<p>Tempo de forno por quilo é uma estimativa; cada forno esquenta diferente e cada peru tem um formato. O único jeito de saber o ponto é medir. Um termômetro de cozinha custa menos que um peru e acaba com a adivinhação.<\/p>\n<ul>\n<li><strong>Coxa: 74 °C<\/strong> — medido na parte mais grossa, sem encostar no osso.<\/li>\n<li>Se o peito estiver dourando antes da coxa chegar lá, cubra só o peito com papel-alumínio.<\/li>\n<li>Tire do forno 2 a 3 graus antes: a temperatura continua subindo no descanso.<\/li>\n<\/ul>\n\n<h3>⏳ Técnica 3: o descanso<\/h3>\n<p>No forno, os sucos da carne são empurrados para o centro. Se você corta o peru direto do forno, esses sucos escorrem pela tábua. Durante 20 a 30 minutos de descanso, coberto frouxamente com alumínio, os sucos se redistribuem pela carne. É a diferença entre uma fatia brilhante e úmida e uma fatia que seca no prato em cinco minutos.<\/p>\n<p>Use esse tempo a seu favor: é quando o forno fica livre para aquecer acompanhamentos, e quando você prepara o molho com o caldo da assadeira.<\/p>\n\n<h3>✅ O roteiro completo<\/h3>\n<ol>\n<li>Descongele na geladeira: 24 horas para cada 2 kg.<\/li>\n<li>Salmoura gelada de 12 a 24 horas (só peru sem tempero).<\/li>\n<li>Seque e passe manteiga temperada por baixo da pele.<\/li>\n<li>Asse coberto a 180 °C, descubra na última hora.<\/li>\n<li>Meça 74 °C na coxa.<\/li>\n<li>Descanse 20 a 30 minutos e fatie contra as fibras.<\/li>\n<\/ol>\n<p>Siga esses passos uma vez e você nunca mais vai ter medo do peru. Ele vira, finalmente, o prato que todo mundo elogia.<\/p>"}, {"id": "ceia-economica", "icon": "💰", "title": "Ceia Bonita Gastando Pouco", "cardDesc": "Como montar uma mesa farta e elegante sem estourar o orçamento de fim de ano.", "subtitle": "Onde economizar sem que ninguém perceba — e onde não economizar.", "content": "<h3>😩 O problema de verdade<\/h3>\n<p>Dezembro já pesa no bolso: presentes, roupas, viagens, décimo terceiro que acaba antes de chegar. E a ceia, que deveria ser um momento de alegria, vira fonte de ansiedade quando você soma o preço do peru, do bacalhau, das castanhas e das frutas secas. Muita gente acaba escolhendo entre gastar o que não tem ou fazer uma ceia que acha \"fraca\".<\/p>\n<p>A boa notícia: o que torna uma ceia memorável não é o preço dos ingredientes. É a <strong>variedade de cores, a abundância visual e o capricho na montagem<\/strong>. E isso dá para conseguir gastando bem menos.<\/p>\n\n<h3>🍗 Troque a carne, não a festa<\/h3>\n<ul>\n<li><strong>Dois frangos recheados<\/strong> rendem a mesma carne que um chester e custam bem menos.<\/li>\n<li><strong>Pernil e costela de porco<\/strong> têm ótimo custo por quilo e alimentam muita gente.<\/li>\n<li><strong>Rocambole de carne moída<\/strong>, recheado e fatiado, fica lindo na travessa.<\/li>\n<li>Se a família faz questão do bacalhau, use o <strong>bacalhau desfiado<\/strong> em bolinhos e na bacalhoada: rende muito mais que postas.<\/li>\n<\/ul>\n\n<h3>🥗 Acompanhamentos rendem a mesa<\/h3>\n<p>Arroz, farofa, batatas e saladas são baratos e fazem a mesa parecer farta. Uma travessa grande de arroz à grega colorido, uma farofa cheia de frutas e uma salada verde com romã dão o efeito de abundância que todo mundo associa ao Natal. Capriche na quantidade e na cor desses pratos, e a carne pode ser mais modesta.<\/p>\n\n<h3>🛒 Compre na hora certa<\/h3>\n<ol>\n<li><strong>Itens secos na primeira semana:<\/strong> farinha, passas, ameixas, latas, leite condensado. Eles não estragam e sobem de preço perto do Natal.<\/li>\n<li><strong>Carnes congeladas na segunda ou terceira semana,<\/strong> antes da corrida.<\/li>\n<li><strong>Frescos só nos dias 22 e 23.<\/strong><\/li>\n<li>Compare sempre o preço do quilo, nunca o da embalagem.<\/li>\n<\/ol>\n\n<h3>🍰 Sobremesa caseira é a maior economia<\/h3>\n<p>Pavê, pudim, rabanada e manjar são feitos com ingredientes baratos e rendem muito. Um panetone caseiro custa uma fração do industrializado de padaria e é muito mais gostoso. As sobremesas caseiras são também as que as pessoas mais elogiam — e as que mais lembram a ceia da avó.<\/p>\n\n<h3>✅ Onde NÃO economizar<\/h3>\n<p>Algumas coisas valem o investimento: <strong>um bom azeite<\/strong> para o bacalhau, <strong>um termômetro de cozinha<\/strong> para não perder a carne, e <strong>tempo de planejamento<\/strong>. Desperdício é o maior custo de qualquer ceia: comida que sobra e vai para o lixo, ou carne que passa do ponto. Planejando as quantidades e o ponto, a ceia econômica sai mais farta do que muita ceia cara.<\/p>"}, {"id": "sobremesas-tradicao", "icon": "🍰", "title": "As Sobremesas que Contam a História do Natal", "cardDesc": "Rabanada, pavê, panetone e tronco de Natal: de onde vêm e como acertar cada uma.", "subtitle": "Tradição de família com técnica de confeitaria.", "content": "<h3>😩 O problema de verdade<\/h3>\n<p>A sobremesa é a última coisa que vai à mesa e a primeira de que as pessoas se lembram. E é justamente onde mais gente erra no Natal: o pavê que desmanchou, o pudim cheio de furinhos, a rabanada encharcada de óleo, o panetone caseiro que ficou denso como um tijolo. Doces dependem de ponto e de tempo, e são os pratos que menos perdoam o improviso.<\/p>\n\n<h3>🍞 Rabanada: o doce da reaproveitamento<\/h3>\n<p>A rabanada nasceu como uma forma de aproveitar o pão amanhecido, e é exatamente isso que faz ela dar certo: <strong>pão de ontem<\/strong>. Pão fresco absorve leite demais e desmancha. Molhe rápido no leite, passe no ovo e frite em óleo bem quente, que sela a superfície e impede o encharcamento. A versão assada é mais leve e ótima para produzir em quantidade.<\/p>\n\n<h3>🥄 Pavê: camada por camada<\/h3>\n<p>O pavê é a sobremesa gelada mais popular do Natal brasileiro. O segredo está em duas coisas: o <strong>creme bem cozido<\/strong>, que precisa engrossar de verdade no fogo, e o <strong>biscoito molhado rapidamente<\/strong>. E ele precisa de pelo menos 6 horas de geladeira para firmar: é a sobremesa perfeita para fazer na véspera.<\/p>\n\n<h3>🎄 Panetone caseiro<\/h3>\n<p>O panetone é uma massa enriquecida, cheia de ovos e manteiga, que precisa de <strong>tempo para crescer<\/strong>. O erro mais comum é ter pressa: massa que não cresceu o bastante vira pão denso. Respeite as duas fermentações, sove até a massa ficar lisa e elástica e passe as frutas na farinha antes de misturar, para não afundarem. Assado, o panetone congela muito bem por até dois meses — o que faz dele um ótimo produto para vender com antecedência.<\/p>\n\n<h3>🪵 O tronco de Natal<\/h3>\n<p>O bûche de Noël vem da tradição europeia de queimar um grande tronco na lareira durante as festas. Virou sobremesa: um rocambole de chocolate decorado como casca de árvore. O truque é <strong>enrolar o pão de ló ainda quente<\/strong> num pano polvilhado; frio, ele racha. Depois é só desenrolar, rechear e enrolar de novo.<\/p>\n\n<h3>✅ Planeje as sobremesas na Semana 4<\/h3>\n<ul>\n<li>Panetones e biscoitos: até 2 semanas antes, congelados.<\/li>\n<li>Pavê, manjar, pudim e torta holandesa: na véspera.<\/li>\n<li>Rabanada: no dia, ou assada pela manhã.<\/li>\n<\/ul>\n<p>Com a ordem certa, a sobremesa deixa de ser a última correria da noite e vira o grande final que todo mundo espera.<\/p>"}, {"id": "vender-no-natal", "icon": "🛍️", "title": "Como Ganhar Dinheiro com Receitas de Natal", "cardDesc": "Panetone, pavê de pote e lembrancinhas: os produtos que mais vendem em dezembro.", "subtitle": "Dezembro é o mês em que as pessoas mais compram comida pronta.", "content": "<h3>😩 O problema de verdade<\/h3>\n<p>Dezembro é o mês do ano em que as famílias mais compram comida pronta: falta tempo, sobra compromisso e todo mundo quer uma mesa bonita. Ao mesmo tempo, é o mês em que muita gente precisa de uma renda extra para fechar as contas das festas. Quem sabe cozinhar tem uma oportunidade enorme nas mãos — mas a maioria não sabe por onde começar, quanto cobrar ou o que produzir.<\/p>\n\n<h3>🏆 Os produtos que mais vendem<\/h3>\n<ul>\n<li><strong>Panetone e chocotone caseiros<\/strong> — podem ser produzidos com semanas de antecedência e congelados.<\/li>\n<li><strong>Pavê e sobremesas de pote<\/strong> — porção individual, fácil de transportar, alto valor percebido.<\/li>\n<li><strong>Biscoitos amanteigados e pão de mel<\/strong> — viram presente e lembrancinha de empresa.<\/li>\n<li><strong>Kits de ceia<\/strong> — salpicão, farofa e uma sobremesa para quem não quer cozinhar.<\/li>\n<li><strong>Rabanada assada em caixinhas<\/strong> — barata de produzir e muito pedida.<\/li>\n<\/ul>\n\n<h3>💲 Como calcular o preço<\/h3>\n<ol>\n<li>Some o custo de todos os ingredientes da receita.<\/li>\n<li>Divida pelo número de unidades que ela rende: esse é o custo por unidade.<\/li>\n<li>Some a embalagem (pote, laço, etiqueta) por unidade.<\/li>\n<li>Multiplique o total por 3 para chegar a um preço que paga seu tempo, gás e energia.<\/li>\n<li>Compare com o preço de padarias da sua região e ajuste.<\/li>\n<\/ol>\n<p>A embalagem bonita é o que faz o produto caseiro valer mais. Um pote transparente com fita vermelha e etiqueta escrita à mão transforma um pavê em presente.<\/p>\n\n<h3>📣 Como divulgar<\/h3>\n<p>Comece pelo seu círculo: família, vizinhos, colegas de trabalho e grupos de WhatsApp do bairro. Fotografe os produtos com luz natural, perto de uma janela, com algum elemento de Natal ao fundo. Abra as encomendas no começo de dezembro com uma data limite, assim você planeja a produção e compra os ingredientes no volume certo.<\/p>\n\n<h3>✅ Comece pequeno<\/h3>\n<p>Escolha dois produtos, teste nas primeiras semanas, faça uma pequena encomenda para conhecidos e ajuste. O cronograma deste app já foi pensado para que você produza com antecedência: o que vale para a sua ceia vale para as suas vendas.<\/p>"}, {"id": "seguranca-alimentar-festas", "icon": "🧊", "title": "Segurança Alimentar nas Festas", "cardDesc": "Os cuidados simples que evitam que a ceia termine com a família passando mal.", "subtitle": "Calor de dezembro e mesa cheia: a combinação perigosa.", "content": "<h3>😩 O problema de verdade<\/h3>\n<p>No Brasil, o Natal acontece no verão. Mesa farta, horas de festa, calor e muitos pratos com maionese, creme e carnes: é exatamente a combinação em que as bactérias se multiplicam mais rápido. Todo ano, os prontos-socorros recebem famílias inteiras com intoxicação alimentar depois das festas. Na grande maioria dos casos, o problema não estava na receita, e sim no <strong>tempo que a comida ficou fora da geladeira<\/strong>.<\/p>\n\n<h3>⏱️ A regra das 2 horas<\/h3>\n<p>Alimentos perecíveis não devem ficar mais de <strong>2 horas em temperatura ambiente<\/strong> — e em dias muito quentes, o ideal é menos ainda. Salpicão, maionese, saladas com creme, pavê e frios são os mais sensíveis. Sirva em porções menores e reponha da geladeira, em vez de deixar a travessa cheia na mesa a noite toda.<\/p>\n\n<h3>🧊 Descongelar do jeito certo<\/h3>\n<ul>\n<li>Sempre na geladeira, nunca na pia ou na bancada.<\/li>\n<li>Peru: 24 horas para cada 2 kg. Um peru de 6 kg precisa de 3 dias.<\/li>\n<li>Coloque a carne numa travessa para não pingar nos outros alimentos.<\/li>\n<li>Nunca recongele carne crua que já foi descongelada.<\/li>\n<\/ul>\n\n<h3>🌡️ Cozinhar até o ponto seguro<\/h3>\n<p>Carnes de ave precisam chegar a <strong>74 °C<\/strong> por dentro, e carne de porco a pelo menos <strong>63 °C<\/strong>. O termômetro de cozinha é o único jeito de ter certeza. Recheios de farofa dentro da ave são um risco extra: o centro do recheio demora a esquentar. Prefira assar a farofa separada.<\/p>\n\n<h3>🔪 Cuidado com a contaminação cruzada<\/h3>\n<p>Use tábuas diferentes para carne crua e para alimentos prontos, como saladas e frios. Lave as mãos depois de mexer na carne crua e antes de montar as saladas. Não reutilize a marinada da carne crua como molho sem ferver antes.<\/p>\n\n<h3>✅ Depois da ceia<\/h3>\n<p>Guarde as sobras na geladeira em até duas horas, em potes fechados, e consuma em até três dias. Com esses cuidados simples, a única lembrança que a ceia vai deixar é a do sabor.<\/p>"}], "podcasts": [{"id": 1, "title": "EP1 · Planejamento da ceia sem estresse", "duration": "5:12", "url": "https://pub-494a57bf4d6f4cbcbeb4ad55a033908f.r2.dev/podcasts/receitas_natal/ep1.mp3", "free": true}, {"id": 2, "title": "EP2 · Entradas, saladas e bebidas que abrem a noite", "duration": "4:50", "url": "https://pub-494a57bf4d6f4cbcbeb4ad55a033908f.r2.dev/podcasts/receitas_natal/ep2.mp3", "free": true}, {"id": 3, "title": "EP3 · O peru suculento e o ponto certo das carnes", "duration": "4:53", "url": "https://pub-494a57bf4d6f4cbcbeb4ad55a033908f.r2.dev/podcasts/receitas_natal/ep3.mp3", "free": true}, {"id": 4, "title": "EP4 · Bacalhau e ceia bonita gastando pouco", "duration": "5:02", "url": "https://pub-494a57bf4d6f4cbcbeb4ad55a033908f.r2.dev/podcasts/receitas_natal/ep4.mp3", "free": true}, {"id": 5, "title": "EP5 · Acompanhamentos, molhos e o poder do freezer", "duration": "4:53", "url": "https://pub-494a57bf4d6f4cbcbeb4ad55a033908f.r2.dev/podcasts/receitas_natal/ep5.mp3", "free": true}, {"id": 6, "title": "EP6 · Sobremesas da tradição e a grande noite", "duration": "4:51", "url": "https://pub-494a57bf4d6f4cbcbeb4ad55a033908f.r2.dev/podcasts/receitas_natal/ep6.mp3", "free": true}], "ebook": {"title": "E-Book Completo", "subtitle": "O guia definitivo da ceia de Natal", "features": [{"icon": "🦃", "text": "Ceia completa passo a passo"}, {"icon": "📋", "text": "Cronograma e lista de compras"}, {"icon": "🍰", "text": "Sobremesas e panetone caseiro"}], "buttonText": "Ler E-Book Grátis", "pdfUrl": "https://pub-494a57bf4d6f4cbcbeb4ad55a033908f.r2.dev/ebooks/receitas_natal_pt.pdf", "url": "https://pub-494a57bf4d6f4cbcbeb4ad55a033908f.r2.dev/ebooks/receitas_natal_pt.pdf"}, "premiumProducts": [{"id": "receitas-reveillon", "name": "Receitas de Réveillon", "icon": "🥂", "coverImage": "https://pub-4 : "15 min"}, {"name": "Chocolate Quente Cremoso", "reps": "10 min"}]}, "Semana 2": {"subtitle": "As Carnes da Ceia", "Segunda - Peru e Aves": [{"name": "Salmoura para Peru Suculento", "reps": "24 h"}, {"name": "Peru Assado de Natal", "reps": "3 h"}, {"name": "Chester com Laranja e Mel", "reps": "2 h 30"}], "Terça - Tender e Lombo": [{"name": "Tender com Calda de Abacaxi", "reps": "1 h 30"}, {"name": "Lombo Suíno com Ameixa", "reps": "2 h"}, {"name": "Glaceado de Mostarda e Mel", "reps": "10 min"}], "Quarta - Pernil e Costela": [{"name": "Pernil Assado na Pinga", "reps": "5 h"}, {"name": "Costela de Porco no Forno", "reps": "3 h"}, {"name": "Marinada Coringa para Carnes", "reps": "12 h"}], "Quinta - Bacalhau": [{"name": "Como Dessalgar o Bacalhau", "reps": "48 h"}, {"name": "Bacalhau à Gomes de Sá", "reps": "1 h 15"}, {"name": "Bacalhoada no Forno", "reps": "1 h 30"}], "Sexta - Opções Econômicas": [{"name": "Frango Assado de Natal Recheado", "reps": "2 h"}, {"name": "Rocambole de Carne Moída Natalino", "reps": "1 h 20"}, {"name": "Peixe Assado com Crosta de Ervas", "reps": "50 min"}], "Sábado - Teste de Ponto": [{"name": "Use o Termômetro de Cozinha", "reps": "10 min"}, {"name": "Descanso da Carne Antes de Fatiar", "reps": "20 min"}, {"name": "Como Fatiar o Peru e o Pernil", "reps": "15 min"}]}, "Semana 3": {"subtitle": "Acompanhamentos e Molhos", "Segunda - Arroz de Festa": [{"name": "Arroz à Grega", "reps": "40 min"}, {"name": "Arroz com Passas e Amêndoas", "reps": "35 min"}, {"name": "Arroz de Forno Natalino", "reps": "50 min"}], "Terça - Farofas": [{"name": "Farofa Natalina com Frutas Secas", "reps": "25 min"}, {"name": "Farofa de Bacon e Ovos", "reps": "20 min"}, {"name": "Farofa Doce de Banana", "reps": "20 min"}], "Quarta - Batatas e Legumes": [{"name": "Batatas Rústicas com Alecrim", "reps": "50 min"}, {"name": "Purê de Batata com Queijo", "reps": "35 min"}, {"name": "Legumes Assados com Mel", "reps": "40 min"}], "Quinta - Molhos": [{"name": "Molho de Laranja para Aves", "reps": "20 min"}, {"name": "Molho Madeira com Champignon", "reps": "25 min"}, {"name": "Molho de Frutas Vermelhas", "reps": "15 min"}], "Sexta - Congelar com Antecedência": [{"name": "O Que Pode Ser Congelado", "reps": "15 min"}, {"name": "Etiquetas e Datas no Freezer", "reps": "10 min"}, {"name": "Descongelamento Seguro", "reps": "24 h"}], "Sábado - Ensaio da Ceia": [{"name": "Monte o Cronograma da Véspera", "reps": "30 min"}, {"name": "Teste a Mesa Posta", "reps": "40 min"}, {"name": "Revise a Lista de Compras", "reps": "15 min"}]}, "Semana 4": {"subtitle": "Sobremesas, Panetone e a Grande Noite", "Segunda - Sobremesas Geladas": [{"name": "Pavê de Natal", "reps": "40 min"}, {"name": "Manjar com Calda de Ameixa", "reps": "4 h"}, {"name": "Mousse de Chocolate de Natal", "reps": "3 h"}], "Terça - Rabanada e Doces da Tradição": [{"name": "Rabanada Tradicional", "reps": "30 min"}, {"name": "Rabanada Assada", "reps": "35 min"}, {"name": "Pudim de Leite Condensado", "reps": "1 h 30"}], "Quarta - Panetone Caseiro": [{"name": "Panetone Caseiro de Frutas", "reps": "6 h"}, {"name": "Chocotone Caseiro", "reps": "6 h"}, {"name": "Panetone Recheado de Pote", "reps": "30 min"}], "Quinta - Tortas e Bolos": [{"name": "Torta de Nozes", "reps": "1 h 20"}, {"name": "Bolo Tronco de Natal", "reps": "1 h 30"}, {"name": "Torta Holandesa", "reps": "4 h"}], "Sexta - Lembrancinhas Comestíveis": [{"name": "Biscoitos Amanteigados de Natal", "reps": "1 h"}, {"name": "Pão de Mel Natalino", "reps": "1 h 15"}, {"name": "Casinha de Biscoito de Gengibre", "reps": "3 h"}], "Sábado - A Grande Noite": [{"name": "Cronograma do Dia 24", "reps": "o dia"}, {"name": "Como Servir Tudo Quente", "reps": "30 min"}, {"name": "O Que Fazer com as Sobras", "reps": "20 min"}]}}, "exerciseDetails": {"Defina o Cardápio da Ceia": {"desc": "O primeiro passo de uma ceia sem estresse: decidir o que vai à mesa antes de comprar qualquer coisa. Uma ceia equilibrada tem 1 a 2 entradas, 1 a 2 carnes, 3 acompanhamentos e 2 sobremesas.", "type": "Planejamento", "series": 1, "steps": ["Anote quantas pessoas virão e se há crianças, vegetarianos ou restrições.", "Escolha 1 carne principal (peru, tender ou pernil) e, se quiser, 1 carne de apoio mais barata.", "Escolha 3 acompanhamentos que não disputem o forno com a carne: um arroz, uma farofa e uma salada fria.", "Escolha 2 sobremesas: uma gelada (feita na véspera) e uma de forno ou panetone.", "Marque ao lado de cada prato se ele pode ser feito ANTES (congelado ou na véspera) ou só NO DIA."], "tip": "Regra de ouro: no dia 24, no máximo 2 pratos devem ser feitos do zero. Todo o resto já deve estar pronto ou pré-preparado."}, "Calcule as Quantidades por Pessoa": {"desc": "Sobra demais custa caro; faltar é pior. Estas são as quantidades médias por adulto que os bufês usam numa ceia com vários pratos.", "type": "Planejamento", "series": 1, "steps": ["Carne principal com osso (peru, pernil): 400 a 500 g por pessoa.", "Carne sem osso (tender, lombo, chester desossado): 250 a 300 g por pessoa.", "Arroz cru: 60 g por pessoa. Farofa: 40 g de farinha por pessoa.", "Salpicão ou maionese: 150 g por pessoa. Salada verde: 1 punhado por pessoa.", "Sobremesa: 1 porção e meia por pessoa somando todas. Bebida: 1 litro por pessoa (somando água, refrigerante e sucos).", "Crianças até 10 anos contam como meia pessoa."], "tip": "Se a ceia tiver 2 carnes, reduza cada uma para 60% da quantidade — ninguém come porção cheia das duas."}, "Monte a Lista de Compras": {"desc": "Uma lista separada por setor e por data evita esquecimento e as filas dos últimos dias, quando os preços sobem.", "type": "Planejamento", "series": 1, "steps": ["Divida a lista em: açougue, hortifrúti, mercearia seca, frios/laticínios e bebidas.", "Marque o que não estraga (farinhas, frutas secas, latas, bebidas) para comprar JÁ nesta semana.", "Marque as carnes congeladas para comprar até a semana 3 — elas precisam de 2 a 3 dias para descongelar.", "Deixe para os dias 22 e 23 só os frescos: folhas, frutas, creme de leite fresco e pão.", "Ao lado de cada item, escreva a quantidade calculada no passo anterior."], "tip": "Compare o preço do quilo, não da embalagem: o peru temperado de marca chega a custar o dobro do peru inteiro sem tempero."}, "Tábua de Frios de Natal": {"desc": "A entrada mais fácil e mais bonita da ceia: montada em 30 minutos e mantém os convidados felizes enquanto a carne termina.", "type": "Entradas", "series": 1, "steps": ["Escolha 3 queijos de texturas diferentes: um macio (brie ou queijo minas), um firme (prato ou gouda) e um curado (parmesão).", "Escolha 2 frios: presunto parma ou peito de peru, e salame.", "Corte os queijos em formatos variados: cubos, fatias e lascas.", "Enrole os frios em formato de rosa ou dobre em leque.", "Preencha os espaços com uvas, damascos, castanhas, azeitonas e geleia num potinho.", "Decore com ramos de alecrim em formato de árvore de Natal."], "tip": "Tire os queijos da geladeira 30 minutos antes de servir: queijo gelado não tem sabor."}, "Pasta de Ricota com Ervas": {"desc": "Pasta leve e barata para servir com torradas ou palitos de legumes.", "type": "Entradas", "series": 1, "steps": ["Amasse 250 g de ricota fresca com um garfo.", "Misture 3 colheres de sopa de iogurte natural ou requeijão.", "Junte 1 dente de alho ralado, sal, pimenta, raspas de limão e um fio de azeite.", "Acrescente salsinha, cebolinha e hortelã picadas.", "Leve à geladeira por pelo menos 1 hora para os sabores se misturarem."], "tip": "Para deixar natalina, sirva numa tigela vermelha e salpique tomatinhos secos picados e folhas verdes por cima."}, "Canapés de Pepino com Salmão": {"desc": "Entrada elegante, fresca e sem forno.", "type": "Entradas", "series": 1, "steps": ["Corte 2 pepinos japoneses em rodelas de 1 cm.", "Misture 150 g de cream cheese com raspas de limão e endro picado.", "Coloque uma colherinha da mistura em cada rodela.", "Cubra com uma lasca de salmão defumado.", "Finalize com pimenta-do-reino moída na hora e um raminho de endro."], "tip": "Versão econômica: troque o salmão por kani ou por tomate-cereja cortado ao meio."}, "Salpicão de Frango Clássico": {"desc": "O salpicão é a salada mais pedida da ceia brasileira. Cremoso, crocante e fácil de fazer na véspera.", "type": "Saladas", "series": 1, "steps": ["Cozinhe 600 g de peito de frango com cebola, alho e louro. Desfie bem.", "Rale 2 cenouras e pique 1 maçã verde e 2 talos de salsão.", "Misture o frango com cenoura, maçã, salsão, 1 lata de milho e 1/2 xícara de uva-passa.", "Tempere com 1 xícara de maionese, 1/2 caixa de creme de leite, suco de limão, sal e pimenta.", "Leve à geladeira coberto.", "Só na hora de servir, cubra com batata palha para ela continuar crocante."], "tip": "Mantenha o salpicão na geladeira até o último minuto e não deixe mais de 2 horas fora dela."}, "Maionese de Batata com Maçã": {"desc": "A maionese de batata da família, com o toque doce da maçã que combina com tender e peru.", "type": "Saladas", "series": 1, "steps": ["Cozinhe 1 kg de batatas em cubos com sal até ficarem macias, mas firmes. Escorra e deixe esfriar.", "Cozinhe 2 cenouras em cubos e 1 xícara de ervilha.", "Pique 1 maçã com casca e 3 ovos cozidos.", "Misture tudo com 1 e 1/2 xícara de maionese, salsinha, sal e um fio de azeite.", "Cubra e leve à geladeira por 2 horas."], "tip": "Batata morna absorve a maionese e vira papa. Espere esfriar completamente antes de misturar."}, "Salada Verde com Frutas e Nozes": {"desc": "A salada que dá leveza à mesa e cor à foto.", "type": "Saladas", "series": 1, "steps": ["Lave e seque bem folhas de alface americana, rúcula e agrião.", "Junte gomos de laranja ou manga e sementes de romã.", "Acrescente nozes levemente torradas e lascas de queijo.", "Molho: 3 colheres de azeite, 1 de mel, 1 de mostarda, suco de meio limão e sal.", "Tempere só na hora de servir."], "tip": "A romã é o toque de Natal: vermelho brilhante, crocante e vende muito bem na foto."}, "Bolinho de Bacalhau": {"desc": "Clássico de festa, pode ser modelado e congelado cru até 1 mês antes.", "type": "Entradas", "series": 1, "steps": ["Dessalgue 400 g de bacalhau, cozinhe por 5 minutos e desfie bem fino.", "Cozinhe 600 g de batata e esprema ainda quente.", "Misture batata, bacalhau, 1 cebola ralada, salsinha, 2 ovos e pimenta.", "Modele bolinhos com duas colheres.", "Frite em óleo a 170 °C até dourar, ou asse a 200 °C por 25 minutos pincelados com azeite.", "Escorra em papel-toalha."], "tip": "Congele os bolinhos crus numa assadeira separados e só depois junte num saco. Frite direto do congelador."}, "Tâmaras com Bacon": {"desc": "Doce e salgado em uma mordida — some primeiro da mesa.", "type": "Entradas", "series": 1, "steps": ["Retire o caroço de 20 tâmaras.", "Recheie cada uma com um pedacinho de queijo ou uma amêndoa.", "Enrole cada tâmara com meia fatia de bacon e prenda com um palito.", "Asse a 200 °C por 15 a 20 minutos, até o bacon ficar crocante.", "Sirva morna."], "tip": "Pincele um pouco de mel nos últimos 5 minutos de forno para caramelizar."}, "Queijo Brie Assado com Mel": {"desc": "Entrada sofisticada que fica pronta em 20 minutos.", "type": "Entradas", "series": 1, "steps": ["Faça cortes cruzados rasos na casca de um queijo brie inteiro.", "Coloque numa assadeira pequena e regue com mel.", "Salpique nozes, alecrim e pimenta-rosa.", "Asse a 180 °C por 12 a 15 minutos, até amolecer.", "Sirva imediatamente com torradas."], "tip": "Sirva logo: depois de 15 minutos fora do forno ele volta a endurecer."}, "Pão de Alho Caseiro": {"desc": "Muito mais barato e saboroso que o industrializado.", "type": "Pães", "series": 1, "steps": ["Misture 100 g de manteiga amolecida, 3 colheres de maionese, 4 dentes de alho espremidos, salsinha e sal.", "Corte pães franceses na diagonal sem separar a base.", "Recheie os cortes com a pasta.", "Cubra com queijo ralado.", "Asse a 200 °C por 15 minutos ou até dourar."], "tip": "A pasta pode ser feita uma semana antes e guardada na geladeira."}, "Pão de Batata Recheado": {"desc": "Pãezinhos macios que podem ser assados e congelados.", "type": "Pães", "series": 1, "steps": ["Bata no liquidificador 1 xícara de batata cozida, 1 xícara de leite morno, 2 ovos, 1/2 xícara de óleo e 1 colher de açúcar.", "Despeje sobre 10 g de fermento biológico seco, 1 colher de sal e 4 xícaras de farinha. Sove até soltar das mãos.", "Deixe crescer coberto por 1 hora.", "Divida em bolinhas, abra, recheie com requeijão ou frango e feche bem.", "Pincele gema e asse a 180 °C por 25 minutos."], "tip": "Asse até dourar levemente, congele e, no dia, termine 8 minutos no forno quente."}, "Torradinhas Temperadas": {"desc": "Torradas crocantes para acompanhar pastas e queijos.", "type": "Pães", "series": 1, "steps": ["Corte uma baguete amanhecida em fatias finas.", "Pincele com azeite temperado com alho, orégano e sal.", "Espalhe numa assadeira em camada única.", "Asse a 180 °C por 10 a 15 minutos, virando na metade.", "Guarde em pote bem fechado depois de frias."], "tip": "Duram até 10 dias num pote hermético — dá para fazer na semana 1."}, "Ponche de Frutas sem Álcool": {"desc": "Bebida colorida para todas as idades.", "type": "Bebidas", "series": 1, "steps": ["Num pote grande, coloque morangos, uvas, pêssego em calda e abacaxi em cubos.", "Junte 1 litro de suco de uva integral e 500 ml de suco de laranja.", "Leve à geladeira por 2 horas.", "Na hora de servir, acrescente 1 litro de água com gás ou guaraná gelado.", "Sirva com gelo e folhas de hortelã."], "tip": "Só junte o gás na hora de servir — antes, ele perde as bolhas."}, "Sangria de Natal": {"desc": "Versão natalina da sangria, com canela e laranja.", "type": "Bebidas", "series": 1, "steps": ["Num jarro, coloque 1 laranja e 1 maçã em fatias finas.", "Junte 1 garrafa de vinho tinto suave, 1/2 xícara de suco de laranja e 2 colheres de açúcar.", "Acrescente 1 pau de canela e 3 cravos.", "Leve à geladeira por pelo menos 4 horas.", "Sirva com gelo e complete com água com gás."], "tip": "Para a versão sem álcool, troque o vinho por suco de uva integral."}, "Chocolate Quente Cremoso": {"desc": "Para as noites frias ou para depois da ceia.", "type": "Bebidas", "series": 1, "steps": ["Numa panela, misture 500 ml de leite, 1 caixa de creme de leite e 2 colheres de amido de milho dissolvido.", "Junte 150 g de chocolate meio amargo picado e 3 colheres de açúcar.", "Mexa em fogo baixo até engrossar.", "Perfume com canela em pó.", "Sirva com chantilly."], "tip": "Em pote fechado, a mistura seca (chocolate, açúcar, amido e canela) vira um ótimo presente para vender."}, "Salmoura para Peru Suculento": {"desc": "O segredo dos chefs para peru e frango que não ressecam: a salmoura faz a carne absorver água e tempero.", "type": "Carnes", "series": 1, "steps": ["Dissolva 1 xícara de sal grosso e 1/2 xícara de açúcar mascavo em 2 litros de água quente.", "Junte 4 litros de água gelada, folhas de louro, alecrim, alho amassado e casca de laranja.", "Espere a salmoura ficar totalmente fria.", "Mergulhe o peru descongelado, totalmente coberto, num balde ou saco próprio.", "Deixe na geladeira de 12 a 24 horas.", "Retire, lave por dentro e por fora e seque muito bem com papel-toalha."], "tip": "Nunca coloque o peru em salmoura morna: ela precisa estar gelada para a carne ficar segura."}, "Peru Assado de Natal": {"desc": "O peru dourado e suculento que é o centro da mesa.", "type": "Carnes", "series": 1, "steps": ["Depois da salmoura, deixe o peru secar destampado na geladeira por algumas horas.", "Passe por baixo da pele uma manteiga temperada com alho, ervas e raspas de laranja.", "Recheie a cavidade com laranja, cebola e ervas (não com farofa, que impede o cozimento por dentro).", "Asse coberto com papel-alumínio a 180 °C, cerca de 40 minutos por quilo.", "Retire o alumínio na última hora, pincele a gordura da assadeira e deixe dourar.", "Está pronto quando a coxa marcar 74 °C no termômetro.", "Descanse 20 minutos coberto antes de fatiar."], "tip": "Peru temperado de marca já vem com salmoura: não faça salmoura nele, ou fica salgado demais."}, "Chester com Laranja e Mel": {"desc": "Mais carne e menos osso que o peru, assa em menos tempo.", "type": "Carnes", "series": 1, "steps": ["Tempere o chester descongelado com suco de 3 laranjas, alho, sal, pimenta e alecrim. Deixe marinar de um dia para o outro.", "Asse coberto com alumínio a 180 °C por 1 h 30.", "Misture 4 colheres de mel com 2 de mostarda e o suco que ficou na assadeira.", "Retire o alumínio, pincele a mistura e asse mais 30 a 40 minutos, pincelando a cada 10.", "Decore com rodelas de laranja e alecrim."], "tip": "Se escurecer muito rápido por causa do mel, cubra só o peito com alumínio."}, "Tender com Calda de Abacaxi": {"desc": "O tender já vem cozido: o trabalho é só dar sabor e brilho.", "type": "Carnes", "series": 1, "steps": ["Retire a rede e faça cortes em losango na superfície do tender.", "Espete um cravo em cada cruzamento.", "Calda: ferva 1 xícara de suco de abacaxi, 1/2 xícara de açúcar mascavo e 2 colheres de mostarda até engrossar.", "Asse o tender a 180 °C por 30 minutos.", "Pincele a calda e asse mais 30 minutos, pincelando a cada 10.", "Decore com rodelas de abacaxi e cerejas."], "tip": "O tender seca fácil: cubra o fundo da assadeira com um dedo de suco de abacaxi."}, "Lombo Suíno com Ameixa": {"desc": "Lombo macio, com recheio de ameixa que vira molho.", "type": "Carnes", "series": 1, "steps": ["Tempere 1,5 kg de lombo com alho, sal, limão, pimenta e vinho branco. Marine por 12 horas.", "Com uma faca comprida, faça um furo no meio do lombo no sentido do comprimento.", "Recheie o furo com ameixas secas sem caroço.", "Asse coberto a 180 °C por 1 hora.", "Descubra e asse mais 40 minutos até dourar, regando com o caldo.", "Confira 63 °C no centro e descanse 10 minutos antes de fatiar."], "tip": "Fatiado, o lombo mostra o círculo de ameixas no meio — um efeito lindo na travessa."}, "Glaceado de Mostarda e Mel": {"desc": "Cobertura curinga para tender, lombo, pernil e frango.", "type": "Carnes", "series": 1, "steps": ["Misture 4 colheres de mel, 2 de mostarda escura, 1 de molho shoyu e 1 de manteiga derretida.", "Acrescente pimenta-do-reino e uma pitada de cravo em pó.", "Aqueça por 1 minuto para ficar fluido.", "Pincele na carne nos últimos 30 minutos de forno.", "Repita a cada 10 minutos para criar camadas brilhantes."], "tip": "Nunca pincele glaceado com açúcar ou mel no começo do forno: queima antes de a carne ficar pronta."}, "Pernil Assado na Pinga": {"desc": "O pernil macio que desfia, tradição de muitas famílias brasileiras.", "type": "Carnes", "series": 1, "steps": ["Fure o pernil (3 a 4 kg) com a ponta da faca por toda a superfície.", "Marinada: bata alho, cebola, sal, pimenta, limão, louro e 1 copo de pinga. Cubra o pernil e deixe na geladeira por 24 horas, virando uma vez.", "Asse coberto com alumínio a 180 °C por 3 a 4 horas, regando com a marinada.", "Descubra e aumente para 220 °C por 30 a 40 minutos para dourar.", "Confira 70 °C no centro para desfiar fácil."], "tip": "Sem pinga? Use cerveja ou vinho branco: o álcool ajuda a amaciar e evapora no forno."}, "Costela de Porco no Forno": {"desc": "Opção mais barata que o pernil e muito saborosa.", "type": "Carnes", "series": 1, "steps": ["Tempere a costela com sal, alho, limão, páprica e pimenta. Marine por 4 horas.", "Embrulhe bem em papel-alumínio.", "Asse a 170 °C por 2 horas.", "Abra o alumínio, pincele molho barbecue ou glaceado de mel.", "Asse mais 30 minutos a 220 °C para caramelizar."], "tip": "Cozinhar embrulhado em temperatura baixa é o que faz a carne soltar do osso."}, "Marinada Coringa para Carnes": {"desc": "Uma marinada que funciona em peru, frango, lombo e pernil.", "type": "Carnes", "series": 1, "steps": ["Bata no liquidificador 1 cebola, 6 dentes de alho, suco de 2 limões e 1 xícara de vinho branco.", "Junte 2 colheres de sal, pimenta, louro, alecrim e tomilho.", "Acrescente 4 colheres de azeite.", "Use 1 xícara de marinada para cada 1 kg de carne.", "Deixe agir de 12 a 24 horas na geladeira, num saco bem fechado."], "tip": "Deixe a carne no saco e massageie de vez em quando para a marinada penetrar por igual."}, "Como Dessalgar o Bacalhau": {"desc": "Bacalhau mal dessalgado estraga qualquer receita. O processo leva 2 dias e precisa começar com antecedência.", "type": "Carnes", "series": 1, "steps": ["Lave as postas em água corrente para tirar o sal da superfície.", "Coloque numa tigela com a pele para cima, coberto de água gelada.", "Deixe na geladeira, trocando a água a cada 6 horas.", "Postas finas: 24 horas. Postas altas: 48 horas.", "Prove um pedacinho cru: deve estar levemente salgado, como tempero bom."], "tip": "Bacalhau dessalgado pode ser congelado por até 3 meses — dá para adiantar."}, "Bacalhau à Gomes de Sá": {"desc": "A receita portuguesa mais amada no Natal brasileiro.", "type": "Carnes", "series": 1, "steps": ["Cozinhe 800 g de bacalhau dessalgado por 5 minutos e lasque em pedaços grandes.", "Cozinhe 1 kg de batatas em rodelas até ficarem macias.", "Doure 3 cebolas em rodelas e 4 dentes de alho em bastante azeite.", "Numa travessa, monte camadas de batata, bacalhau e cebola.", "Regue generosamente com azeite e leve ao forno a 200 °C por 20 minutos.", "Decore com ovos cozidos em rodelas, azeitonas pretas e salsinha."], "tip": "Seja generoso no azeite: é ele que faz o prato. Use azeite extra virgem."}, "Bacalhoada no Forno": {"desc": "Bacalhau com legumes coloridos, servido na própria travessa.", "type": "Carnes", "series": 1, "steps": ["Lasque 800 g de bacalhau dessalgado.", "Faça camadas de batata em rodelas, pimentão vermelho e verde, tomate, cebola e bacalhau.", "Regue com 1 xícara de azeite e tempere com pimenta e salsinha.", "Cubra com alumínio e asse a 200 °C por 40 minutos.", "Retire o alumínio, junte azeitonas e ovos cozidos e asse mais 15 minutos."], "tip": "Use pimentões vermelho e verde: as cores do Natal na travessa."}, "Frango Assado de Natal Recheado": {"desc": "A ceia festiva com orçamento apertado: um frango inteiro recheado alimenta 4 pessoas.", "type": "Carnes", "series": 1, "steps": ["Tempere o frango com sal, alho, limão e páprica. Marine por 12 horas.", "Recheio: farofa úmida com bacon, cebola, azeitona e uva-passa.", "Recheie a cavidade sem apertar e feche com palito.", "Asse coberto a 200 °C por 1 hora.", "Descubra, pincele manteiga e asse mais 30 minutos até dourar."], "tip": "Dois frangos custam menos que um chester e rendem a mesma quantidade de carne."}, "Rocambole de Carne Moída Natalino": {"desc": "Econômico, bonito fatiado e pode ser feito na véspera.", "type": "Carnes", "series": 1, "steps": ["Tempere 1 kg de carne moída com cebola, alho, ovo, farinha de rosca, sal e salsinha.", "Abra a carne sobre plástico filme num retângulo de 1 cm.", "Cubra com presunto, queijo, cenoura cozida em tiras e ovos cozidos.", "Enrole com a ajuda do plástico e retire-o.", "Asse a 200 °C por 50 minutos, cobrindo com molho de tomate nos últimos 15."], "tip": "Deixe esfriar um pouco antes de fatiar, ou o recheio escorrega."}, "Peixe Assado com Crosta de Ervas": {"desc": "Opção leve para quem não come carne vermelha ou porco.", "type": "Carnes", "series": 1, "steps": ["Tempere filés de pescada ou tilápia com sal, limão e pimenta.", "Crosta: misture farinha panko, parmesão, salsinha, raspas de limão e manteiga derretida.", "Coloque os filés numa assadeira untada e cubra com a crosta.", "Asse a 200 °C por 20 a 25 minutos, até a crosta dourar.", "Sirva com gomos de limão."], "tip": "Peixe passa do ponto rápido: confira aos 18 minutos."}, "Use o Termômetro de Cozinha": {"desc": "O único jeito garantido de não servir carne seca ou crua. Custa pouco e salva a ceia.", "type": "Carnes", "series": 1, "steps": ["Insira a ponta na parte mais grossa da carne, sem encostar no osso.", "Peru e frango: 74 °C na coxa.", "Pernil e lombo: 63 °C (fatiável) a 70 °C (para desfiar).", "Tender: 60 °C (ele já vem cozido; é só aquecer).", "Tire a carne do forno 3 graus antes: a temperatura continua subindo no descanso."], "tip": "Teste o termômetro em água fervente: deve marcar perto de 100 °C."}, "Descanso da Carne Antes de Fatiar": {"desc": "Cortar a carne direto do forno faz todo o suco escorrer na tábua.", "type": "Carnes", "series": 1, "steps": ["Retire a carne do forno e coloque numa tábua ou travessa.", "Cubra frouxamente com papel-alumínio.", "Peru e pernil: descanse 20 a 30 minutos. Lombo e tender: 10 minutos.", "Use esse tempo para aquecer os acompanhamentos no forno.", "Aproveite o caldo da assadeira para fazer o molho."], "tip": "O descanso é o momento perfeito para tirar as fotos da ceia."}, "Como Fatiar o Peru e o Pernil": {"desc": "Fatias bonitas fazem a carne render mais e a travessa impressionar.", "type": "Carnes", "series": 1, "steps": ["Use faca bem afiada e longa e um garfo trinchante.", "Peru: separe as coxas e asas primeiro, depois fatie o peito em fatias de 1 cm, contra as fibras.", "Pernil: fatie em volta do osso, sempre contra as fibras.", "Arrume as fatias sobrepostas na travessa.", "Regue com um pouco do molho para não ressecar."], "tip": "Fatiar contra as fibras deixa a carne mais macia na boca."}, "Arroz à Grega": {"desc": "O arroz colorido que é a cara do Natal.", "type": "Acompanhamentos", "series": 1, "steps": ["Refogue 1 cebola picada em manteiga.", "Junte 2 xícaras de arroz e refogue por 2 minutos.", "Acrescente 4 xícaras de água quente e sal. Cozinhe até secar.", "À parte, refogue cenoura em cubinhos, ervilha, milho e pimentão vermelho.", "Misture os legumes ao arroz pronto, com uva-passa e cheiro-verde."], "tip": "Cozinhe a cenoura separada: se for junto com o arroz, ela fica dura ou o arroz empapa."}, "Arroz com Passas e Amêndoas": {"desc": "Arroz festivo com o contraste doce e crocante.", "type": "Acompanhamentos", "series": 1, "steps": ["Refogue 1 cebola em manteiga e junte 2 xícaras de arroz.", "Cozinhe com água quente e sal.", "Doure 1/2 xícara de amêndoas em lâminas na manteiga.", "Hidrate 1/2 xícara de uva-passa em água quente por 10 minutos.", "Misture amêndoas e passas ao arroz pronto e salpique salsinha."], "tip": "Para quem não gosta de passa, sirva as passas numa tigelinha à parte."}, "Arroz de Forno Natalino": {"desc": "Pode ser montado na véspera e só vai ao forno na hora.", "type": "Acompanhamentos", "series": 1, "steps": ["Misture 4 xícaras de arroz cozido com 1 lata de creme de leite e 200 g de presunto em cubos.", "Junte milho, ervilha, azeitonas e 200 g de mussarela em cubos.", "Coloque numa travessa untada.", "Cubra com queijo ralado.", "Asse a 200 °C por 25 minutos, até gratinar."], "tip": "Excelente para usar as sobras de peru e tender no dia 25."}, "Farofa Natalina com Frutas Secas": {"desc": "A farofa da ceia, úmida, colorida e cheia de sabor.", "type": "Acompanhamentos", "series": 1, "steps": ["Doure 150 g de bacon em cubos e reserve.", "Na gordura, refogue 1 cebola e 2 colheres de manteiga.", "Junte damasco picado, uva-passa, ameixa picada e castanhas.", "Acrescente 3 xícaras de farinha de mandioca aos poucos, mexendo até tostar levemente.", "Volte o bacon e finalize com salsinha."], "tip": "A farofa pode ser feita 2 dias antes e aquecida numa frigideira."}, "Farofa de Bacon e Ovos": {"desc": "A farofa simples que todo mundo ama.", "type": "Acompanhamentos", "series": 1, "steps": ["Frite 200 g de bacon até ficar crocante.", "Junte 1 cebola picada e 3 colheres de manteiga.", "Acrescente 4 ovos batidos e mexa até cozinharem.", "Junte 3 xícaras de farinha de mandioca e mexa até soltinha.", "Ajuste o sal e acrescente cebolinha."], "tip": "Use farinha de mandioca torrada fina para uma farofa mais leve."}, "Farofa Doce de Banana": {"desc": "Acompanha muito bem o pernil e o lombo.", "type": "Acompanhamentos", "series": 1, "steps": ["Derreta 4 colheres de manteiga e junte 1 cebola picada.", "Acrescente 4 bananas-nanicas em rodelas e doure levemente.", "Salpique canela e uma pitada de açúcar mascavo.", "Junte 2 xícaras de farinha de mandioca e mexa até incorporar.", "Finalize com sal a gosto."], "tip": "Use bananas maduras, mas firmes, para não virarem purê."}, "Batatas Rústicas com Alecrim": {"desc": "Crocantes por fora e macias por dentro, sem fritura.", "type": "Acompanhamentos", "series": 1, "steps": ["Corte 1 kg de batatas com casca em gomos.", "Cozinhe por 5 minutos em água com sal e escorra.", "Tempere com azeite, alho amassado, alecrim, sal e páprica.", "Espalhe numa assadeira sem amontoar.", "Asse a 220 °C por 35 a 40 minutos, virando na metade."], "tip": "A pré-cozida e a assadeira sem amontoar são o que fazem a batata ficar crocante."}, "Purê de Batata com Queijo": {"desc": "Cremoso e reconfortante, combina com qualquer carne.", "type": "Acompanhamentos", "series": 1, "steps": ["Cozinhe 1 kg de batata em água com sal até ficar bem macia.", "Esprema ainda quente.", "Junte 3 colheres de manteiga, 1 xícara de leite quente e sal.", "Acrescente 100 g de queijo parmesão ralado e noz-moscada.", "Mexa em fogo baixo até ficar liso e cremoso."], "tip": "Nunca bata o purê no liquidificador: ele vira cola."}, "Legumes Assados com Mel": {"desc": "Acompanhamento colorido e saudável.", "type": "Acompanhamentos", "series": 1, "steps": ["Corte cenoura, abóbora, beterraba e cebola roxa em pedaços parecidos.", "Tempere com azeite, sal, pimenta e tomilho.", "Asse a 200 °C por 30 minutos.", "Regue com 2 colheres de mel e asse mais 10 minutos.", "Finalize com castanhas picadas."], "tip": "Asse a beterraba numa parte separada da assadeira para não tingir os outros legumes."}, "Molho de Laranja para Aves": {"desc": "O molho clássico para peru, chester e frango.", "type": "Acompanhamentos", "series": 1, "steps": ["Aqueça o caldo que ficou na assadeira da ave e coe.", "Junte 1 xícara de suco de laranja e raspas de uma laranja.", "Acrescente 2 colheres de açúcar mascavo e ferva por 5 minutos.", "Engrosse com 1 colher de amido de milho dissolvida em água.", "Finalize com 1 colher de manteiga gelada."], "tip": "A manteiga gelada no final deixa o molho brilhante."}, "Molho Madeira com Champignon": {"desc": "Molho encorpado para tender, lombo e rosbife.", "type": "Acompanhamentos", "series": 1, "steps": ["Refogue 1 cebola picada em manteiga.", "Junte 200 g de champignon fatiado.", "Acrescente 1/2 xícara de vinho tinto e deixe reduzir.", "Junte 1 xícara de caldo de carne e 1 colher de extrato de tomate.", "Engrosse com 1 colher de farinha e cozinhe até encorpar."], "tip": "Pode ser feito na véspera e aquecido em fogo baixo."}, "Molho de Frutas Vermelhas": {"desc": "Agridoce, vai bem com carnes e com sobremesas.", "type": "Acompanhamentos", "series": 1, "steps": ["Numa panela, coloque 300 g de frutas vermelhas congeladas.", "Junte 1/2 xícara de açúcar e suco de meio limão.", "Cozinhe em fogo médio por 10 minutos.", "Para carnes, acrescente 1 colher de vinagre balsâmico.", "Deixe esfriar: ele engrossa."], "tip": "A mesma receita sem o balsâmico serve de calda para pudim e cheesecake."}, "O Que Pode Ser Congelado": {"desc": "Congelar com antecedência é o que tira o estresse da véspera.", "type": "Planejamento", "series": 1, "steps": ["PODE congelar: bolinhos crus, carnes temperadas, farofa, pão de alho, molhos, massa de biscoito, panetone assado e pão de batata.", "NÃO congele: salpicão, maionese, saladas folhosas, pavê e pudim.", "Congele em porções do tamanho que será usado.", "Use sacos próprios para freezer, tirando todo o ar.", "Deixe espaço no freezer para as carnes da semana 4."], "tip": "Comida congelada até 30 dias antes mantém sabor e textura de feita na hora."}, "Etiquetas e Datas no Freezer": {"desc": "Sem etiqueta, você esquece o que tem no freezer — e compra de novo.", "type": "Planejamento", "series": 1, "steps": ["Escreva em cada pacote: nome, quantidade e data.", "Anote também como reaquecer (forno, frigideira ou micro-ondas).", "Faça uma lista do que está congelado e cole na porta da geladeira.", "Organize por dia de uso: o que vai primeiro fica na frente.", "Risque da lista o que for sendo usado."], "tip": "Use fita crepe e caneta permanente: barato e não descola no frio."}, "Descongelamento Seguro": {"desc": "Descongelar errado é a principal causa de intoxicação nas festas.", "type": "Planejamento", "series": 1, "steps": ["Descongele sempre na geladeira, nunca na pia.", "Peru: 24 horas para cada 2 kg. Um peru de 6 kg precisa de 3 dias.", "Coloque a carne numa travessa para pegar o líquido.", "Pratos prontos: passe para a geladeira na noite anterior.", "Nunca recongele carne crua que já foi descongelada."], "tip": "Faça a conta de trás para frente: peru de 6 kg vai para a geladeira no dia 21."}, "Monte o Cronograma da Véspera": {"desc": "Um cronograma hora a hora transforma o caos em tranquilidade.", "type": "Planejamento", "series": 1, "steps": ["Defina o horário da ceia (por exemplo, 22h) e trabalhe de trás para frente.", "Anote o horário de entrada de cada prato no forno.", "Reserve o forno para a carne principal e use o fogão para o resto.", "Separe a louça e as travessas no dia 23.", "Deixe 1 hora livre antes da ceia para se arrumar."], "tip": "Cole o cronograma na geladeira. Na correria, ninguém lembra de cabeça."}, "Teste a Mesa Posta": {"desc": "Montar a mesa antes evita descobrir na hora que falta travessa.", "type": "Planejamento", "series": 1, "steps": ["Coloque toalha, sousplats, pratos, talheres e copos.", "Posicione as travessas vazias no lugar onde cada prato vai ficar.", "Verifique se há espaço para a carne principal no centro.", "Monte um centro de mesa baixo, para as pessoas se verem.", "Tire uma foto para lembrar a montagem no dia."], "tip": "Velas, pinhas e ramos de alecrim fazem um centro de mesa lindo e barato."}, "Revise a Lista de Compras": {"desc": "A última conferência antes da corrida final.", "type": "Planejamento", "series": 1, "steps": ["Confira o que já está comprado e o que já está congelado.", "Risque os itens prontos.", "Separe a lista final dos frescos para os dias 22 e 23.", "Confira gás, papel-alumínio, filme plástico e sacos de lixo.", "Compre gelo e bebidas extras."], "tip": "Papel-alumínio e gás são os dois itens mais esquecidos na véspera."}, "Pavê de Natal": {"desc": "O pavê é o rei das sobremesas de Natal. Faça na véspera para firmar.", "type": "Sobremesas", "series": 1, "steps": ["Creme: leve ao fogo 1 litro de leite, 1 lata de leite condensado, 3 gemas e 3 colheres de amido. Mexa até engrossar.", "Molhe biscoitos champanhe rapidamente em leite com chocolate.", "Num refratário, alterne camadas de biscoito, creme e pêssego em calda picado.", "Termine com creme.", "Cubra com chantilly ou merengue e raspas de chocolate.", "Leve à geladeira por pelo menos 6 horas."], "tip": "Molhe o biscoito rápido: se encharcar, o pavê desmancha."}, "Manjar com Calda de Ameixa": {"desc": "Sobremesa delicada e tradicional, feita um dia antes.", "type": "Sobremesas", "series": 1, "steps": ["Misture 1 litro de leite, 1 vidro de leite de coco, 1/2 xícara de açúcar e 1 xícara de amido de milho.", "Leve ao fogo mexendo sempre até engrossar.", "Despeje numa forma de buraco molhada.", "Leve à geladeira por 6 horas.", "Calda: cozinhe 200 g de ameixas secas com 1 xícara de açúcar e 1 xícara de água por 15 minutos.", "Desenforme e cubra com a calda fria."], "tip": "Molhe a forma com água fria antes: o manjar desenforma perfeito."}, "Mousse de Chocolate de Natal": {"desc": "Mousse aerada que fica pronta para servir em taças individuais.", "type": "Sobremesas", "series": 1, "steps": ["Derreta 200 g de chocolate meio amargo.", "Junte 1 caixa de creme de leite e misture.", "Bata 4 claras em neve com 3 colheres de açúcar.", "Incorpore as claras ao chocolate com movimentos suaves.", "Distribua em taças e leve à geladeira por 3 horas."], "tip": "Decore com raspas de laranja: chocolate e laranja é combinação clássica de Natal."}, "Rabanada Tradicional": {"desc": "A rabanada é o doce mais típico do Natal brasileiro.", "type": "Sobremesas", "series": 1, "steps": ["Corte pão amanhecido (francês ou de rabanada) em fatias de 2 cm.", "Molhe as fatias em 1 litro de leite com 1/2 lata de leite condensado.", "Passe em 3 ovos batidos.", "Frite em óleo quente até dourar dos dois lados.", "Escorra e passe em açúcar com canela."], "tip": "Pão do dia anterior é obrigatório: pão fresco desmancha no leite."}, "Rabanada Assada": {"desc": "Mais leve, sem fritura, e dá para fazer muitas de uma vez.", "type": "Sobremesas", "series": 1, "steps": ["Molhe as fatias de pão no leite com leite condensado e depois no ovo.", "Coloque numa assadeira untada com manteiga.", "Asse a 200 °C por 15 minutos.", "Vire e asse mais 10 minutos.", "Passe em açúcar e canela ainda quentes."], "tip": "Ótima para vender: rende muito e não deixa a cozinha com cheiro de fritura."}, "Pudim de Leite Condensado": {"desc": "Liso, sem furinhos e com calda brilhante.", "type": "Sobremesas", "series": 1, "steps": ["Calda: derreta 1 xícara de açúcar até ficar dourado, junte 1/2 xícara de água e ferva. Espalhe na forma.", "Bata 1 lata de leite condensado, a mesma medida de leite e 3 ovos.", "Coe a mistura sobre a calda.", "Cubra com alumínio e asse em banho-maria a 180 °C por 1 h 30.", "Deixe esfriar e leve à geladeira por 6 horas antes de desenformar."], "tip": "Bater pouco e coar é o segredo do pudim sem furinhos."}, "Panetone Caseiro de Frutas": {"desc": "O panetone caseiro é uma das receitas que mais vendem no Natal.", "type": "Sobremesas", "series": 1, "steps": ["Fermento: misture 30 g de fermento biológico fresco, 1/2 xícara de leite morno e 1 colher de açúcar. Espere espumar.", "Junte 500 g de farinha, 3 ovos, 100 g de manteiga, 1/2 xícara de açúcar, raspas de laranja e essência de panetone. Sove até a massa ficar lisa e elástica.", "Incorpore 200 g de frutas cristalizadas e uva-passa passadas na farinha.", "Deixe crescer coberto por 2 horas.", "Divida em formas de panetone, preenchendo até a metade, e deixe crescer até a borda.", "Faça um corte em cruz, coloque manteiga e asse a 180 °C por 35 a 40 minutos."], "tip": "Panetone assado congela muito bem por até 2 meses — dá para produzir para vender com antecedência."}, "Chocotone Caseiro": {"desc": "A versão com gotas de chocolate que agrada às crianças.", "type": "Sobremesas", "series": 1, "steps": ["Use a mesma massa do panetone caseiro, sem as frutas.", "Substitua as frutas por 200 g de gotas de chocolate forneáveis.", "Deixe crescer e coloque nas formas.", "Asse a 180 °C por 35 a 40 minutos.", "Cubra com chocolate derretido depois de frio."], "tip": "Use gotas forneáveis: o chocolate comum derrete e mancha a massa."}, "Panetone Recheado de Pote": {"desc": "Sobremesa rápida com panetone comprado, ótima para vender em potes.", "type": "Sobremesas", "series": 1, "steps": ["Corte um panetone em cubos.", "Faça um creme com 1 lata de leite condensado, 1 caixa de creme de leite e 2 gemas, cozido até engrossar.", "Em potes, alterne camadas de panetone, creme e frutas vermelhas.", "Termine com chantilly.", "Leve à geladeira por 2 horas."], "tip": "Potes de 250 ml são o tamanho que mais vende no Natal."}, "Torta de Nozes": {"desc": "Torta crocante e úmida, clássica das festas.", "type": "Sobremesas", "series": 1, "steps": ["Massa: misture 2 xícaras de farinha, 100 g de manteiga gelada, 1 ovo e 3 colheres de açúcar. Forre uma forma de fundo removível.", "Recheio: misture 1 lata de leite condensado, 2 ovos e 200 g de nozes picadas.", "Despeje o recheio sobre a massa crua.", "Asse a 180 °C por 40 minutos.", "Decore com nozes inteiras e calda de caramelo."], "tip": "Pré-assar a massa por 10 minutos antes do recheio deixa o fundo mais crocante."}, "Bolo Tronco de Natal": {"desc": "O famoso bûche de Noël, um rocambole de chocolate em forma de tronco.", "type": "Sobremesas", "series": 1, "steps": ["Bata 4 ovos com 1 xícara de açúcar até dobrar de volume.", "Incorpore 1/2 xícara de farinha e 3 colheres de cacau peneirados.", "Asse numa assadeira forrada a 180 °C por 12 minutos.", "Desenforme sobre um pano polvilhado e enrole ainda quente. Espere esfriar.", "Desenrole, recheie com brigadeiro mole ou chantilly e enrole de novo.", "Cubra com ganache e risque com um garfo para imitar a casca da árvore."], "tip": "Enrolar o pão de ló ainda quente é o que evita que ele rache."}, "Torta Holandesa": {"desc": "Torta gelada que impressiona e não vai ao forno.", "type": "Sobremesas", "series": 1, "steps": ["Base: 1 pacote de biscoito de maisena triturado com 100 g de manteiga. Forre o fundo da forma.", "Creme: bata 200 g de manteiga com 1 xícara de açúcar, junte 1 lata de creme de leite e 1 colher de essência de baunilha.", "Espalhe o creme sobre a base e congele por 2 horas.", "Faça uma ganache de chocolate e cubra a torta.", "Contorne a lateral com biscoitos tipo calipso."], "tip": "Desenforme ainda congelada e deixe na geladeira até a hora de servir."}, "Biscoitos Amanteigados de Natal": {"desc": "Os biscoitos que viram presente, lembrancinha e produto de venda.", "type": "Sobremesas", "series": 1, "steps": ["Bata 200 g de manteiga com 1/2 xícara de açúcar.", "Junte 1 ovo e 1 colher de essência de baunilha.", "Acrescente 3 xícaras de farinha até a massa soltar das mãos.", "Abra entre plásticos com 0,5 cm e corte com cortadores de estrela, árvore e boneco.", "Asse a 180 °C por 12 minutos, até as bordas começarem a dourar.", "Decore com glacê depois de frios."], "tip": "Leve a massa à geladeira por 30 minutos antes de cortar: os formatos não deformam."}, "Pão de Mel Natalino": {"desc": "Pão de mel macio, com especiarias de Natal.", "type": "Sobremesas", "series": 1, "steps": ["Misture 1 xícara de mel, 1 xícara de leite, 1/2 xícara de açúcar mascavo e 2 colheres de manteiga.", "Junte 2 xícaras de farinha, 2 colheres de cacau, 1 colher de canela, cravo e gengibre em pó e 1 colher de bicarbonato.", "Despeje numa assadeira untada.", "Asse a 180 °C por 25 minutos.", "Corte em quadrados, recheie com doce de leite e banhe em chocolate."], "tip": "Embale em papel celofane com fita vermelha: vira lembrancinha pronta para vender."}, "Casinha de Biscoito de Gengibre": {"desc": "Projeto de família que vira centro de mesa e atração para as crianças.", "type": "Sobremesas", "series": 1, "steps": ["Massa: misture 3 xícaras de farinha, 1 colher de gengibre em pó, 1 de canela, 1/2 xícara de mel, 100 g de manteiga e 1 ovo.", "Abra a massa e recorte as peças: 2 paredes, 2 laterais e 2 telhados (use moldes de papel).", "Asse a 180 °C por 12 minutos e deixe esfriar completamente.", "Glacê de cola: bata 1 clara com 2 xícaras de açúcar de confeiteiro até ficar firme.", "Cole as paredes e o telhado com o glacê e espere secar 1 hora.", "Decore com balas, confeitos e glacê."], "tip": "Monte com 1 dia de antecedência: o glacê precisa de horas para endurecer de verdade."}, "Cronograma do Dia 24": {"desc": "O roteiro da grande noite, hora a hora, para uma ceia às 22h.", "type": "Planejamento", "series": 1, "steps": ["Manhã: tire as sobremesas e pratos da véspera da lista; arrume a mesa.", "14h: carne principal no forno (peru de 5 kg leva cerca de 3 h 30 + descanso).", "17h: monte as saladas frias e guarde na geladeira.", "19h: prepare arroz e farofa; aqueça os pratos congelados.", "20h30: carne sai do forno e descansa; entra o que precisa aquecer.", "21h30: tome banho e se arrume. 22h: sirva."], "tip": "Peça ajuda: delegue a mesa, as bebidas e a louça. Você não precisa fazer tudo sozinho."}, "Como Servir Tudo Quente": {"desc": "O desafio de toda ceia: todos os pratos quentes ao mesmo tempo.", "type": "Planejamento", "series": 1, "steps": ["Aqueça as travessas vazias no forno morno antes de servir.", "Mantenha acompanhamentos tampados no forno desligado.", "Use o descanso da carne para aquecer o resto.", "Sirva o molho bem quente numa molheira separada.", "Deixe as entradas frias na mesa enquanto termina os quentes."], "tip": "Uma garrafa térmica grande mantém o molho quente por horas."}, "O Que Fazer com as Sobras": {"desc": "As sobras da ceia rendem refeições ótimas no function renderNav(){$('nav').innerHTML=C.navigation.map(n=>`<button class="${n.page==cur?'on':''}" onclick="go('${n.page}')"><b>${({home:'🏠',reels:'🎬',podcast:'🎧',ebook:'📖',treinos:'🍽️',progress:'🔥',quiz:'🧠'})[n.page]||'•'}</b>${n.label}</button>`).join('')}
function allRecipes(){const r=[];for(const w in C.treinos)for(const day in C.treinos[w])if(day!='subtitle')C.treinos[w][day].forEach(x=>r.push(x.name));return r}
function home(){const h=C.hero;const ph=h.phrases[new Date().getDate()%h.phrases.length];
return `<div class="hero">${C.app.logoUrl?`<img src="${C.app.logoUrl}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}<span class="badge">${h.badge}</span><h1>${h.title}</h1><p>${C.app.tagline}</p>
<button class="btn" onclick="go('${h.buttonPrimary.page}')">${h.buttonPrimary.text}</button><button class="btn s" onclick="go('${h.buttonSecondary.page}')">${h.buttonSecondary.text}</button></div>
<div class="card"><p>💬 ${ph}</p></div>
<h2>${C.labels.artigosTitle||'Dicas'}</h2>`+C.articles.map((a,i)=>`<div class="card click" onclick="art(${i})"><b>${a.icon} ${a.title}</b><div class="mu">${a.cardDesc}</div></div>`).join('')
+`<h2>📰 Novidades</h2><div class="grid">`+C.news.map((n,i)=>`<a href="${n.url}" target="_blank" style="color:inherit;text-decoration:none"><div class="th"><img src="${n.thumb}" alt="" referrerpolicy="no-referrer" onerror="this.remove()"><span>${['🎄','🦃','🍰','💰','🎁'][i%5]}</span></div><div style="font-size:.85rem">${n.title}</div></a>`).join('')+`</div>`
+(C.premiumProducts.length?`<h2>⭐ Premium</h2>`+C.premiumProducts.map(p=>`<div class="card">${p.coverImage?`<img src="${p.coverImage}" referrerpolicy="no-referrer" onerror="this.remove()" style="width:100%;border-radius:12px">`:''}<h3>${p.icon} ${p.name}</h3><p>${p.story}</p><ul>${p.benefits.map(b=>`<li>${b}</li>`).join('')}</ul></div>`).join(''):'')}
function art(i){const a=C.articles[i];openM(`<h2>${a.icon} ${a.title}</h2><p class="mu">${a.subtitle}</p><div class="art">${a.content}</div>`)}
function treinos(){const W=C.treinos[week];let h=`<h1>${C.labels.pageTreinos}</h1><p class="mu">${C.labels.treinosSubtitle}</p><div class="tabs">`+Object.keys(C.treinos).map(w=>`<button class="${w==week?'on':''}" onclick="week='${w}';go('treinos')">${w}</button>`).join('')+`</div><p><b>${W.subtitle}</b></p>`;
for(const day in W){if(day=='subtitle')continue;h+=`<div class="card"><h3>${day}</h3>`+W[day].map(r=>{const k=r.name.replace(/'/g,"\\'");return `<div class="rec ${st[r.name]?'done':''}"><input type="checkbox" ${st[r.name]?'checked':''} onclick="event.stopPropagation();tog('${k}')"><span class="n" onclick="rec('${k}')">${r.name}</span><span class="mu">⏱ ${r.reps}</span></div>`}).join('')+`</div>`}return h}
function tog(n){st[n]=!st[n];save();go(cur)}
function rec(n){const r=C.exerciseDetails[n];if(!r)return;openM(`<span class="badge" style="background:var(--g)">${r.type}</span><h2>${n}</h2><p>${r.desc}</p><h3>Passo a passo</h3><ol>${r.steps.map(s=>`<li style="margin:6px 0">${s}</li>`).join('')}</ol>${r.tip?`<div class="tip">💡 ${r.tip}</div>`:''}<button class="btn" onclick="tog('${n.replace(/'/g,"\\'")}');closeM()">${st[n]?'Desmarcar':'✔ Marcar como feita'}</button>`)}
function podcast(){return `<h1>🎧 Podcast</h1><p class="mu">${C.labels.podcastSubtitle||''}</p>`+C.podcasts.map(p=>`<div class="card"><b>${p.title}</b> <span class="mu">${p.duration}</span><audio controls preload="none" src="${p.url}"></audio><a class="mu" href="${p.url}" target="_blank">↗ Abrir áudio em nova aba</a></div>`).join('')}
function ebook(){const e=C.ebook;return `<h1>📖 ${e.title}</h1><p class="mu">${e.subtitle}</p>`+e.features.map(f=>`<div class="card">${f.icon} ${f.text}</div>`).join('')+`<a class="btn" href="${e.pdfUrl}" target="_blank">${e.buttonText}</a>`}
function reels(){return `<h1>🎬 Vídeo-aulas</h1>`+C.videoAulas.map(v=>`<div class="card"><span class="badge">${v.num}</span> <b>${v.title}</b><video controls preload="none" poster="${v.thumb}" src="${v.videoUrl}"></video><a class="mu" href="${v.videoUrl}" target="_blank">↗ Abrir vídeo em nova aba</a></div>`).join('')}
function progress(){const all=allRecipes(),d=all.filter(n=>st[n]).length,pc=Math.round(d/all.length*100);const days=Math.max(0,Math.ceil((new Date(new Date().getFullYear(),11,24)-new Date())/864e5));
return `<h1>🔥 Progresso</h1><div class="card"><h2>${days} dias</h2><p class="mu">${C.labels.ofensivaHome||'até a ceia'}</p></div><div class="card"><p>${C.labels.exerciciosFeitos}: <b>${d}/${all.length}</b></p><div class="bar"><i style="width:${pc}%"></i></div><p class="mu">${C.progressPhrases[Math.min(4,Math.floor(pc/20))]}</p></div>`+Object.keys(C.treinos).map(w=>{const r=[];for(const k in C.treinos[w])if(k!='subtitle')C.treinos[w][k].forEach(x=>r.push(x.name));const dd=r.filter(n=>st[n]).length;return `<div class="card"><b>${w}</b> — ${C.treinos[w].subtitle}<div class="bar" style="margin-top:6px"><i style="width:${dd/r.length*100}%"></i></div><span class="mu">${dd}/${r.length}</span></div>`}).join('')}
let q={cat:null,i:0,s:0,list:[]};
function quiz(){if(!q.cat)return `<h1>🧠 Quiz</h1>`+C.quiz.categories.map(c=>`<div class="card click" onclick="startQ('${c.id}')"><b>${c.icon} ${c.name}</b><div class="mu">${c.desc}</div></div>`).join('');
if(q.i>=q.list.length)return `<h1>Resultado</h1><div class="card"><h2>${q.s}/${q.list.length} acertos</h2><button class="btn" onclick="q.cat=null;go('quiz')">Voltar</button></div>`;
const x=q.list[q.i];return `<p class="mu">Pergunta ${q.i+1}/${q.list.length}</p><h2>${x.question}</h2><div id="opts">`+x.options.map((o,k)=>`<button class="opt" onclick="ans(${k})">${o}</button>`).join('')+`</div><div id="ex"></div>`}
function startQ(c){q={cat:c,i:0,s:0,list:C.quiz.questions.filter(x=>x.category==c)};go('quiz')}
function ans(k){const x=q.list[q.i],b=document.querySelectorAll('.opt');b.forEach((e,j)=>{e.disabled=true;if(j==x.correct)e.classList.add('ok');else if(j==k)e.classList.add('bad')});if(k==x.correct)q.s++;
$('ex').innerHTML=`<div class="tip">${x.explanation}</div><button class="btn" onclick="q.i++;go('quiz')">Próxima →</button>`}
function openM(h){$('mc').innerHTML=h;$('modal').style.display='block';$('modal').scrollTop=0}
function closeM(){$('modal').style.display='none'}
go('home');
</script></body></html>
